name: Build application artifacts

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux executable
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tkinter
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Linux executable
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name AppInventoryExporter-linux-x86_64 \
            app_inventory.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppInventoryExporter-linux-x86_64
          path: dist/AppInventoryExporter-linux-x86_64

  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Windows executable
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name AppInventoryExporter-windows-x86_64 `
            app_inventory.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppInventoryExporter-windows-x86_64
          path: dist/AppInventoryExporter-windows-x86_64.exe

  build-macos:
    name: Build macOS application
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build macOS application
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name AppInventoryExporter-macos-arm64 \
            app_inventory.py

      - name: Create macOS archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/AppInventoryExporter-macos-arm64.app \
            AppInventoryExporter-macos-arm64.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppInventoryExporter-macos-arm64
          path: AppInventoryExporter-macos-arm64.zip
